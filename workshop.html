<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Design Workshop</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-black text-light">
  <header class="bg-success text-white">
    <div class="container py-5">
      <span class="badge text-bg-light text-success mb-3">Free workshop</span>
      <h1 class="display-5 fw-bold">Web Design Workshop</h1>
      <p class="lead mb-0">Build your first responsive webpage with HTML and Bootstrap.</p>
    </div>
  </header>

  <main class="container py-4 py-md-5">
    <div class="row g-4">
      <section class="col-12 col-md-5" aria-labelledby="details-heading">
        <div class="card shadow-sm bg-dark text-white border-success">
          <div class="card-body p-4">
            <h2 id="details-heading" class="h4 mb-3 text-success">Workshop details</h2>
            <dl class="mb-0">
              <dt class="text-success">Day</dt>
              <dd class="mb-3">Saturday</dd>
              <dt class="text-success">Location</dt>
              <dd class="mb-3">School computer lab</dd>
              <dt class="text-success">What to bring</dt>
              <dd class="mb-0">A laptop and charger</dd>
            </dl>
          </div>
        </div>
      </section>

      <section class="col-12 col-md-7" aria-labelledby="register-heading">
        <div class="card shadow-sm bg-dark text-white border-success">
          <div class="card-body p-4">
            <h2 id="register-heading" class="h4 mb-3 text-success">Register for a session</h2>
            <form action="#register-heading" aria-describedby="demo-note">
              <div class="mb-3">
                <label for="full-name" class="form-label text-light">Full name</label>
                <input id="full-name" class="form-control bg-black text-light border-success" type="text" autocomplete="name" required>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label text-light">Email address</label>
                <input id="email" class="form-control bg-black text-light border-success" type="email" autocomplete="email" required>
              </div>

              <fieldset class="mb-4">
                <legend class="fs-6 fw-semibold text-success">Choose a session</legend>
                <div class="form-check">
                  <input id="morning" class="form-check-input bg-dark border-success" type="radio" name="session" value="morning" required>
                  <label for="morning" class="form-check-label text-light">Morning · 9:00–11:00 AM</label>
                </div>
                <div class="form-check">
                  <input id="afternoon" class="form-check-input bg-dark border-success" type="radio" name="session" value="afternoon" required>
                  <label for="afternoon" class="form-check-label text-light">Afternoon · 2:00–4:00 PM</label>
                </div>
              </fieldset>

              <div class="d-grid d-sm-block">
                <button class="btn btn-success px-4" type="submit">Register</button>
              </div>
              <p id="demo-note" class="form-text text-success mt-3 mb-0">Practice form. Entries are discarded.</p>
            </form>
          </div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
